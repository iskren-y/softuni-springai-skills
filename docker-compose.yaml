
services:

  springai-skills-app:
    build: .
    working_dir: /app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_API_KEY=${TELEGRAM_BOT_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - COMPANYBOOK_API_KEY=${COMPANYBOOK_API_KEY}
      - AGENT_SKILLS_DIR=.agent/skills
    networks:
      - app-network
    volumes:
      - ./build/libs/softuni-springai-skills-1.0-SNAPSHOT.jar:/app/example-app.jar
    entrypoint: [ "java", "-jar", "/app/example-app.jar" ]

networks:
  app-network:
