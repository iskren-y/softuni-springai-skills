plugins {
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'groovy'
}

group = 'ai.community'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.30'

    implementation 'org.springframework.boot:spring-boot-starter'

    // Spring AI 1.1.3 (via BOM for clean deps)
    // Kudos for Christian Tzolov and the rest of the Spring AI team!!!
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M4')
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

    implementation "org.springaicommunity:spring-ai-agent-utils:0.7.0"

    // Telegram Bot API client
    implementation 'com.github.pengrad:java-telegram-bot-api:9.4.1'
}

test {
    useJUnitPlatform()
}